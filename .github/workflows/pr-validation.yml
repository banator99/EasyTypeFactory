
name: PR Validation

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test (.NET 8 on Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Display .NET Environment Info
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run .NET 8 tests with diagnostics
        shell: pwsh
        timeout-minutes: 15
        run: |
          dotnet test `
            --no-build `
            --configuration Release `
            --framework net8.0 `
            --blame-hang `
            --blame-hang-timeout 3m `
            --blame-hang-dump-type full `
            --logger "console;verbosity=detailed" `
            --diag vstest.log `
            --results-directory TestResults

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-net8-diagnostics
          path: |
            TestResults/**
            **/TestResults/**
            vstest*.log
          if-no-files-found: warn
          retention-days: 7


