
name: PR Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (.NET ${{ matrix.dotnet }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        dotnet:
          - '8.0'
          - '9.0'
          - '10.0'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Display .NET Environment Info
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Run .NET ${{ matrix.dotnet }} tests
        timeout-minutes: 12
        run: >
          dotnet test
          --no-build
          --configuration Release
          --framework net${{ matrix.dotnet }}
          --verbosity normal
